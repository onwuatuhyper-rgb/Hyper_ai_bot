name: Build HYPER AI BOT APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-fix project configs & install dependencies
        run: |
          sed -i 's/flet==0.24.1/flet>=0.25.2/g' requirements.txt
          cat << 'EOF' > pyproject.toml
          [project]
          name = "hyper-ai-bot"
          version = "1.0.0"
          description = "HYPER AI BOT - Deriv Automated Trading System"
          requires-python = ">=3.10"
          dependencies = [
              "flet>=0.25.2",
              "websockets",
              "pandas",
              "numpy",
              "scikit-learn",
          ]

          [tool.flet]
          org = "com.hypervynx"
          product = "HYPER AI BOT"
          company = "Hypervynx"
          copyright = "Copyright (C) 2026 Hypervynx"

          [tool.flet.android.permission]
          "android.permission.INTERNET" = true
          "android.permission.WAKE_LOCK" = true
          EOF
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev clang cmake ninja-build pkg-config

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]>=0.25.2"

      - name: Build Android APK
        run: |
          yes | flet build apk --yes --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyper-ai-bot-apk
          path: build/apk/*.apk
          
